name: Contribución al Atlas Urbano Regional
description: Proponer o revisar metadatos de un producto para el catálogo regional del Atlas
title: "[Atlas] "
labels: ["tipo:atlas"]
body:
  - type: input
    id: product_title
    attributes:
      label: Título del producto y archivo en atlas/products/
    validations:
      required: true
  - type: textarea
    id: coverage_temporal
    attributes:
      label: Cobertura espacial, resolución y periodo de referencia
    validations:
      required: true
  - type: textarea
    id: sources_method
    attributes:
      label: Fuentes de datos, método e indicador (con unidad)
    validations:
      required: true
  - type: textarea
    id: limitations_license
    attributes:
      label: Limitaciones de interpretación y condiciones de reutilización autorizadas
    validations:
      required: true
